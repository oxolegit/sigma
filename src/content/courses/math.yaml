title: Математический анализ
source: По Н. С. Пискунову, «Дифференциальное и интегральное исчисления для втузов»
description: Производные, интегралы, дифференциальные уравнения и ряды — по учебнику Пискунова. Каждая формула проверена, к каждой теме — тренажёр с проверкой ответа и ссылка на главу учебника.
subject: Математика
chapterLabel: Модуль
literature:
  - id: piskunov
    cite: 'Пискунов Н. С. Дифференциальное и интегральное исчисления для втузов. В 2 т. — Изд. 12-е. — М.: Наука, 1978.'
    url: https://urss.ru/cgi-bin/db.pl?lang=Ru&blang=ru&page=Book&id=38227
    note: Ссылки даны до главы, названия глав — по оглавлению этого издания; главы нумеруются сквозь оба тома. В других изданиях номера глав отличаются, поэтому рядом с номером всегда название — по нему глава находится в любом издании.
