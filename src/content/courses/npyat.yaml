title: Неэнергетическое применение ядерных технологий
source: По вопросам к зачёту · МИФИ
description: 'История ядерной физики от радиоактивности до первых реакторов и то, как ядерные технологии работают вне энергетики — в медицине, промышленности и науке. Оглавление — 30 вопросов зачёта; к каждому написанному — опыты в лабораториях, которые можно повторить своими руками.'
subject: Физика реакторов
semester: 1 семестр
chapterLabel: Раздел
literature:
  - id: chadwick-nature
    cite: 'Chadwick J. Possible existence of a neutron // Nature. — 1932. — Vol. 129, № 3252. — P. 312.'
    note: 'Короткое письмо от 17 февраля 1932 г.: гипотеза нейтрона и оценка его массы.'
  - id: chadwick-prs
    cite: 'Chadwick J. The existence of a neutron // Proceedings of the Royal Society A. — 1932. — Vol. 136, № 830. — P. 692–708.'
    note: 'Полная статья: мишени от водорода до аргона, скорости отдачи 3.3·10⁹ и 4.7·10⁸ см/с, масса по реакции на боре.'
  - id: fermi-cp1
    cite: 'Fermi E. Experimental production of a divergent chain reaction // American Journal of Physics. — 1952. — Vol. 20, № 9. — P. 536–558.'
    note: 'Отчёт Ферми о кладке CP-1: решётка, измерения при сборке, пуск 2 декабря 1942 г. Рассекречен после войны.'
