title: Ядерная физика
source: По сборнику задач МИФИ (2019) и учебнику Мухина · главы 1–4
description: 'Релятивистская кинематика, масса и энергия связи ядер, капельная и оболочечная модели, квадрупольный момент и ферми-газ, рассеяние Резерфорда и потери энергии заряженных частиц в веществе. Все задачи сборника до конца главы 4 — с разборами; к контрольной — варианты с проверкой ответов.'
subject: Физика
semester: 1 семестр
chapterLabel: Модуль
literature:
  - id: zadachnik
    cite: 'Астапов И. И., Барбашина Н. С., Дмитриева А. Н., Задеба Е. А., Хохлов С. С., Яшин И. И. Сборник задач по курсу «Ядерная физика»: учебное пособие. — М.: НИЯУ МИФИ, 2019. — 64 с.'
    note: 'Основной задачник курса: номера задач в уроках — по нему. Константы, массы нуклидов и параметры формулы Вайцзеккера — из его приложения, поэтому ответы совпадают с ответами сборника.'
  - id: mukhin
    cite: 'Мухин К. Н. Экспериментальная ядерная физика. Кн. 1. Физика атомного ядра. Ч. I. Свойства нуклонов, ядер и радиоактивных излучений. — 5-е изд. — М.: Энергоатомиздат, 1993. — 376 с.'
    note: 'Теория: §§ 2–7 — свойства ядер, §§ 10–12 — модели, §§ 23–25 — взаимодействие частиц с веществом.'
chapters:
  - n: 1
    title: Кинематика
    lessons:
      - { n: 1, title: 'Энергия, импульс и длина волны', ref: 'задачи 1.1–1.6, 1.12–1.21' }
      - { n: 2, title: 'Распады, пороги и система центра масс', ref: 'задачи 1.7–1.11, 1.22–1.28' }
  - n: 2
    title: Свойства ядер
    lessons:
      - { n: 3, title: 'Масса и энергия связи ядра', ref: 'задачи 2.5–2.15, 2.19' }
      - { n: 4, title: 'Размер и плотность ядра', ref: 'задачи 2.1–2.4, 2.16–2.18, 3.9–3.10' }
  - n: 3
    title: Модели ядер
    lessons:
      - { n: 5, title: Капельная модель и формула Вайцзеккера, ref: 'задачи 3.1–3.8' }
      - { n: 6, title: 'Оболочки: спин, чётность, магнитный момент', ref: 'задачи 3.11–3.13' }
      - { n: 7, title: Квадрупольный момент и ферми-газ, ref: 'задачи 3.14–3.19' }
  - n: 4
    title: Заряженные частицы в веществе
    lessons:
      - { n: 8, title: 'Рассеяние Резерфорда и кулоновский барьер', ref: 'задачи 4.1–4.6' }
      - { n: 9, title: Ионизационные потери и пробеги, ref: 'задачи 4.7–4.17, 4.19' }
      - { n: 10, title: 'Электроны: тормозное излучение и поглощение', ref: 'задачи 4.18, 4.20–4.30' }
