    cite: 'Хохлов С. С., Дмитриева А. Н. Свойства распределений случайных величин: учебное пособие. — М.: НИЯУ МИФИ, 2022. — 122 с.'
    note: Пособие НОЦ НЕВОД; разделы и примеры — по нумерации этого издания. Задачи лекций о распаде протона, мёртвом времени и «истинной» скорости счёта разобраны в нём как примеры 3.1–3.5.
