title: Математическая статистика
source: По лекциям курса и пособию Хохлова и Дмитриевой · МИФИ, 2022
description: Случайные величины, их моменты и квантили, распределение Пуассона и счёт событий, мёртвое время детектора, метод наименьших квадратов и максимального правдоподобия. На каждую тему — лаборатории с Монте-Карло, к каждому модулю — самостоятельная с проверкой ответов.
subject: Анализ данных
semester: 1 семестр
chapterLabel: Модуль
