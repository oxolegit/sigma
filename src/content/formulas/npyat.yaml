items:
  - id: recoil-max
    title: Скорость ядра после лобового удара
    match: ['u_{\max}=\frac{2m}{m+M}v']
    display: '\htmlData{s=u}{u_{\max}} = \frac{2\htmlData{s=m}{m}}{\htmlData{s=m}{m} + \htmlData{s=M}{M}}\,\htmlData{s=v}{v}'
    meaning: 'Наибольшая скорость, которую упругий удар частицы сообщает покоящемуся ядру, — при лобовом ударе. Лёгкое ядро получает почти вдвое большую скорость, тяжёлое — почти никакой.'
    symbols:
      - { s: u, tex: 'u_{\max}', text: 'скорость ядра отдачи при лобовом ударе', unit: 'см/с' }
      - { s: m, tex: 'm', text: 'масса налетающей частицы', unit: 'а.е.м.' }
      - { s: M, tex: 'M', text: 'масса ядра-мишени: водород 1, азот 14', unit: 'а.е.м.' }
      - { s: v, tex: 'v', text: 'скорость налетающей частицы', unit: 'см/с' }
    when: 'Упругий удар, ядро до удара покоится, скорости нерелятивистские — для нейтронов в несколько МэВ это так (v ≈ 0.1c).'
    derivation:
      - { note: 'Импульс и энергия при лобовом ударе:', tex: 'mv = mv'' + Mu,\qquad mv^2 = mv''^2 + Mu^2' }
      - { note: 'Из первого $v'' = v - Mu/m$; подставим во второе и сократим на $u$:', tex: 'u = \frac{2m}{m + M}\,v' }
    example: 'Нейтрон (m = 1) и протон (M = 1): u = v — нейтрон останавливается, протон уходит с его скоростью.'
  - id: chadwick-ratio
    title: Масса нейтрона по отдаче водорода и азота
    match: ['\frac{u_H}{u_N}=\frac{m+14}{m+1}']
    display: '\frac{\htmlData{s=H}{u_H}}{\htmlData{s=N}{u_N}} = \frac{\htmlData{s=m}{m} + 14}{\htmlData{s=m}{m} + 1}'
    meaning: 'Отношение наибольших скоростей отдачи двух ядер от одного излучения. Неизвестная скорость нейтронов сокращается, и остаётся уравнение для одной массы — так Чедвик взвесил частицу, которую нельзя было увидеть.'
    symbols:
      - { s: H, tex: 'u_H', text: 'наибольшая скорость протонов отдачи; у Чедвика 3.3·10⁹', unit: 'см/с' }
      - { s: N, tex: 'u_N', text: 'наибольшая скорость ядер азота отдачи; у Чедвика 4.7·10⁸', unit: 'см/с' }
      - { s: m, tex: 'm', text: 'масса нейтрона', unit: 'а.е.м.' }
    when: 'Обе мишени облучают одним и тем же излучением, скорости измеряют по пробегам ядер отдачи. Точность определяется пробегами — около 10 %.'
    derivation:
      - { note: 'Для каждой мишени $u = 2mv/(m + M)$; делим одно на другое — $2mv$ сокращается.' }
      - { note: 'Отношение $r = u_H/u_N$ даёт линейное уравнение:', tex: 'r(m + 1) = m + 14 \;\Rightarrow\; m = \frac{14 - r}{r - 1}' }
    example: 'r = 3.3·10⁹/4.7·10⁸ = 7.02: m = (14 − 7.02)/(7.02 − 1) = 1.16 а.е.м.'
  - id: compton-recoil
    title: Энергия γ-кванта по отдаче ядра
    match: ['\sqrt{T^2+2TMc^2}']
    display: '\htmlData{s=E}{E_\gamma} = \frac{\htmlData{s=T}{T} + \sqrt{\htmlData{s=T}{T}^2 + 2\htmlData{s=T}{T}\htmlData{s=M}{Mc^2}}}{2}'
    meaning: 'Какая энергия нужна γ-кванту, чтобы комптоновским рассеянием передать ядру кинетическую энергию T. Это минимальная энергия: квант рассеян точно назад.'
    symbols:
      - { s: E, tex: 'E_\gamma', text: 'энергия γ-кванта', unit: 'МэВ' }
      - { s: T, tex: 'T', text: 'измеренная энергия ядра отдачи', unit: 'МэВ' }
      - { s: M, tex: 'Mc^2', text: 'энергия покоя ядра: протон 938.3, ¹⁴N 13 040', unit: 'МэВ' }
    when: 'Свободное покоящееся ядро; формула точная, релятивистская. Для Жолио-Кюри и Чедвика — проверка гипотезы «бериллиевое излучение — это γ».'
    derivation:
      - { note: 'Наибольшая энергия отдачи при комптоновском рассеянии на массе $M$ (рассеяние на 180°):', tex: 'T = \frac{2E^2}{Mc^2 + 2E}' }
      - { note: 'Квадратное уравнение $2E^2 - 2TE - TMc^2 = 0$, положительный корень:', tex: 'E = \frac{T + \sqrt{T^2 + 2TMc^2}}{2}' }
    example: 'Протон с T = 5.7 МэВ требует E = 54.6 МэВ, ядро азота с T = 1.2 МэВ — 89 МэВ. Излучение одно, энергий две — противоречие.'
  - id: energy-transfer
    title: Доля энергии в упругом ударе
    match: ['\frac{4mM}{(m+M)^2}\cos^2\varphi']
    display: '\frac{\Delta E}{E} = \frac{4\htmlData{s=m}{m}\htmlData{s=M}{M}}{(\htmlData{s=m}{m} + \htmlData{s=M}{M})^2}\cos^2\htmlData{s=f}{\varphi}'
    meaning: 'Какую долю энергии нейтрон отдаёт ядру в упругом ударе. Больше всего — при равных массах: поэтому лёгкие ядра хорошо замедляют нейтроны, а тяжёлые — почти нет.'
    symbols:
      - { s: m, tex: 'm', text: 'масса нейтрона', unit: 'а.е.м.' }
      - { s: M, tex: 'M', text: 'масса ядра', unit: 'а.е.м.' }
      - { s: f, tex: '\varphi', text: 'угол вылета ядра отдачи относительно направления нейтрона; φ = 0 — лобовой удар' }
    when: 'Упругое рассеяние на свободном покоящемся ядре. Для тепловых нейтронов важны тепловое движение и химическая связь — формула перестаёт работать.'
    derivation:
      - { note: 'Ядро уходит вдоль линии центров со скоростью $u = \tfrac{2m}{m + M}v\cos\varphi$.' }
      - { note: 'Отношение энергий:', tex: '\frac{Mu^2}{mv^2} = \frac{4mM}{(m + M)^2}\cos^2\varphi' }
    example: 'Лобовой удар: водород — 1, дейтерий — 0.89, углерод — 0.28, свинец — 0.019.'
  - id: source-kinetics
    title: Кинетика подкритической сборки с источником
    match: ['\frac{dN}{dt}=\frac{k-1}{\ell}N+S']
    display: '\frac{d\htmlData{s=N}{N}}{dt} = \frac{\htmlData{s=k}{k} - 1}{\htmlData{s=l}{\ell}}\htmlData{s=N}{N} + \htmlData{s=S}{S}'
    meaning: 'За время жизни поколения ℓ число нейтронов умножается на k, а источник добавляет S в секунду. Если k < 1, счёт выходит на плато Sℓ/(1 − k); если k > 1, растёт экспоненциально с периодом ℓ/(k − 1).'
    symbols:
      - { s: N, tex: 'N', text: 'число нейтронов, пропорциональное скорости счёта', unit: 'имп/с' }
      - { s: k, tex: 'k', text: 'эффективный коэффициент размножения' }
      - { s: l, tex: '\ell', text: 'время жизни поколения с учётом запаздывающих нейтронов', unit: 'с' }
      - { s: S, tex: 'S', text: 'источник нейтронов', unit: 'имп/с²' }
    when: 'Точечная модель без групп запаздывающих нейтронов: ℓ — эффективное время, порядка 0.1 с для природного урана с графитом.'
    derivation:
      - { note: 'Постоянная k — линейное уравнение $\dot N = aN + S$, $a = (k - 1)/\ell$:', tex: 'N(t) = N_\infty + (N_0 - N_\infty)e^{at},\qquad N_\infty = -\frac{S}{a} = \frac{S\ell}{1 - k}' }
      - { note: 'При $k > 1$ показатель положителен: рост с периодом $T = \ell/(k - 1)$, источник уже не важен.' }
    example: 'k = 0.96, ℓ = 0.1 с, S = 2: плато 5, установление за ~2.5 с. k = 0.999 — плато 200 и 100 с ожидания.'
  - id: inverse-multiplication
    title: Обратный коэффициент умножения
    match: ['\frac{1}{M}=\frac{N_0}{N}']
    display: '\frac{1}{\htmlData{s=M}{M}} = \frac{\htmlData{s=N0}{N_0}}{\htmlData{s=N}{N}} \propto 1 - \htmlData{s=k}{k}'
    meaning: 'Мера близости к критике. В подкритике счёт на плато обратно пропорционален 1 − k, поэтому 1/M убывает к нулю, когда k → 1. Продолжив график 1/M прямой до нуля, предсказывают критическое положение — до того, как его достичь.'
    symbols:
      - { s: M, tex: 'M', text: 'коэффициент умножения — во сколько раз вырос счёт' }
      - { s: N0, tex: 'N_0', text: 'счёт на плато в начальном, заведомо подкритичном состоянии', unit: 'имп/с' }
      - { s: N, tex: 'N', text: 'счёт на плато в текущем состоянии', unit: 'имп/с' }
      - { s: k, tex: 'k', text: 'коэффициент размножения в текущем состоянии' }
    when: 'Счёт снимают только на плато. Кривая 1/M не обязательно прямая — экстраполяцию делают по последним двум точкам и повторяют после каждого шага.'
    derivation:
      - { note: 'На плато $N = S\ell/(1 - k)$, значит $N_0/N = (1 - k)/(1 - k_0)$ — линейно по $1 - k$.' }
    example: 'Счёт 100 при 0 %, 200 при 50 %: 1/M = 0.5, прямая через (0, 1) и (50, 0.5) пересекает ноль при 100 %.'
  - id: bateman-np
    title: Уравнения Бейтмана для цепочки ²³⁹U → ²³⁹Pu
    match: ['\frac{dN_{\text{Np}}}{dt}']
    display: '\frac{d\htmlData{s=Np}{N_{\text{Np}}}}{dt} = \htmlData{s=lu}{\lambda_{\text{U}}}\htmlData{s=U}{N_{\text{U}}} - \htmlData{s=ln}{\lambda_{\text{Np}}}\htmlData{s=Np}{N_{\text{Np}}},\qquad \frac{d\htmlData{s=Pu}{N_{\text{Pu}}}}{dt} = \htmlData{s=ln}{\lambda_{\text{Np}}}\htmlData{s=Np}{N_{\text{Np}}}'
    meaning: 'Каждое звено цепочки получает ядра от распада предыдущего и теряет своим распадом. Решение — суммы экспонент; нептуний — запас плутония «в пути», который после останова реактора ещё неделю превращается в плутоний.'
    symbols:
      - { s: U, tex: 'N_{\text{U}}', text: 'ядра ²³⁹U; приток — захваты в ²³⁸U со скоростью R' }
      - { s: Np, tex: 'N_{\text{Np}}', text: 'ядра ²³⁹Np' }
      - { s: Pu, tex: 'N_{\text{Pu}}', text: 'ядра ²³⁹Pu — на этих временах стабилен' }
      - { s: lu, tex: '\lambda_{\text{U}}', text: 'постоянная распада ²³⁹U, T½ = 23.5 мин', unit: 'сут⁻¹' }
      - { s: ln, tex: '\lambda_{\text{Np}}', text: 'постоянная распада ²³⁹Np, T½ = 2.36 сут', unit: 'сут⁻¹' }
    when: 'Постоянная скорость захвата R, без выгорания плутония и захватов в нём — для коротких кампаний наработчиков это хорошее приближение.'
    derivation:
      - { note: 'Уран: $\dot N_{\text{U}} = R - \lambda_{\text{U}}N_{\text{U}}$ — равновесие $R/\lambda_{\text{U}}$ за час.' }
      - { note: 'Нептуний при облучении длительностью $t$ с нуля:', tex: 'N_{\text{Np}} = R\left[\frac{1 - e^{-\lambda_{\text{Np}}t}}{\lambda_{\text{Np}}} - \frac{e^{-\lambda_{\text{U}}t} - e^{-\lambda_{\text{Np}}t}}{\lambda_{\text{Np}} - \lambda_{\text{U}}}\right]' }
      - { note: 'Без притока сумма $N_{\text{U}} + N_{\text{Np}} + N_{\text{Pu}}$ сохраняется — ядра только переходят по цепочке.' }
    example: 'После 30 сут облучения нептуния ≈ 3.4R; за неделю выдержки 87 % его становится плутонием.'
