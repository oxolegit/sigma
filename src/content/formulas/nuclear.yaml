items:
  - id: energy-momentum
    title: Связь энергии и импульса
    match: ['E^2=(pc)^2+(mc^2)^2']
    display: '\htmlData{s=E}{E}^2 = (\htmlData{s=p}{p}\htmlData{s=c}{c})^2 + (\htmlData{s=m}{m}\htmlData{s=c}{c}^2)^2'
    meaning: 'Главное соотношение релятивистской кинематики: полная энергия, импульс и масса образуют прямоугольный треугольник с гипотенузой E. Зная любые две величины, находите третью — и через неё всё остальное.'
    symbols:
      - { s: E, tex: 'E', text: 'полная энергия частицы, E = T + mc²', unit: 'МэВ' }
      - { s: p, tex: 'p', text: 'импульс; удобнее сразу писать pc — тоже в МэВ', unit: 'МэВ/c' }
      - { s: m, tex: 'm', text: 'масса покоя; mc² — энергия покоя (протон 938.3, электрон 0.511)', unit: 'МэВ/c²' }
      - { s: c, tex: 'c', text: 'скорость света — в единицах МэВ из формул пропадает' }
    when: 'Всегда — для любой свободной частицы при любой скорости. Для фотона m = 0 и E = pc. Классический предел T = p²/2m получается, когда pc ≪ mc².'
    derivation:
      - { note: 'Энергия и импульс через лоренц-фактор:', tex: 'E = \gamma mc^2,\qquad pc = \beta\gamma\,mc^2' }
      - { note: 'Вычтем квадраты:', tex: 'E^2 - (pc)^2 = \gamma^2(1 - \beta^2)(mc^2)^2 = (mc^2)^2' }
      - { note: 'Через кинетическую энергию $E = T + mc^2$:', tex: 'pc = \sqrt{T(T + 2mc^2)}' }
    example: 'Электрон с T = 1 МэВ: pc = √(1·(1 + 1.022)) = 1.42 МэВ, E = 1.511 МэВ, β = pc/E = 0.94.'
  - id: weizsacker
    title: Формула Вайцзеккера
    match: ['\alphaA-\betaA^{2/3}', '\underbrace{\alphaA}']
    display: '\htmlData{s=W}{W} = \htmlData{s=a}{\alpha A} - \htmlData{s=b}{\beta A^{2/3}} - \htmlData{s=g}{\gamma\frac{Z(Z-1)}{A^{1/3}}} - \htmlData{s=d}{\delta\frac{(A-2Z)^2}{A}} + \htmlData{s=z}{\zeta A^{-3/4}}'
    meaning: 'Энергия связи ядра в капельной модели: ядро — капля заряженной несжимаемой жидкости. Пять слагаемых — пять свойств капли, пять параметров описывают энергии связи сотен ядер с точностью около процента.'
    symbols:
      - { s: W, tex: 'W', text: 'энергия связи ядра (A, Z)', unit: 'МэВ' }
      - { s: a, tex: '\alpha A', text: 'объём: каждый нуклон связан с соседями одинаково, α = 15.6 МэВ', unit: 'МэВ' }
      - { s: b, tex: '\beta A^{2/3}', text: 'поверхность: у нуклонов снаружи меньше соседей, β = 17.2 МэВ', unit: 'МэВ' }
      - { s: g, tex: '\gamma Z(Z-1)/A^{1/3}', text: 'кулон: каждый протон отталкивается от остальных, γ = 0.72 МэВ', unit: 'МэВ' }
      - { s: d, tex: '\delta(A-2Z)^2/A', text: 'асимметрия: по принципу Паули выгодно N = Z, δ = 23.6 МэВ', unit: 'МэВ' }
      - { s: z, tex: '\zeta A^{-3/4}', text: 'спаривание: +34 у чётно-чётных, 0 у нечётных, −34 МэВ у нечётно-нечётных', unit: 'МэВ' }
    when: 'Средние и тяжёлые ядра — ошибка порядка процента. Для лёгких (A < 20) капля груба: у ⁴He формула даёт 30.2 МэВ вместо 28.3. Оболочечные эффекты (магические числа) формула не видит.'
    derivation:
      - { note: 'Ядерные силы насыщаются — объёмный член пропорционален числу нуклонов: $\alpha A$.' }
      - { note: 'Радиус $R = r_0A^{1/3}$, площадь поверхности $\propto A^{2/3}$ — поверхностные нуклоны недосвязаны.' }
      - { note: 'Кулоновская энергия шара $\tfrac35 Z^2e^2/R$; без самодействия $Z^2 \to Z(Z-1)$, а $R \propto A^{1/3}$.' }
      - { note: 'Асимметрия и спаривание — квантовые поправки: принцип Паули и притяжение одинаковых нуклонов в пары.' }
    example: '⁵⁶Fe: 873.6 − 251.8 − 122.3 − 6.7 + 1.7 = 494.4 МэВ; по таблице масс 492.3 МэВ.'
  - id: bethe
    title: Формула Бете для ионизационных потерь
    match: ['K\frac{z^2Z}{A\beta^2}']
    display: '-\frac{dE}{dx} = \htmlData{s=K}{K}\,\frac{\htmlData{s=z}{z}^2\htmlData{s=Z}{Z}}{\htmlData{s=A}{A}\,\htmlData{s=b}{\beta}^2}\ln\frac{2m_ec^2\beta^2}{\htmlData{s=I}{I}}'
    meaning: 'Сколько энергии тяжёлая заряженная частица теряет на ионизацию на единице пути (на грамм на см²). Потери растут как z²/β²: медленная и многозарядная частица тормозится сильнее; от массы частицы не зависят.'
    symbols:
      - { s: K, tex: 'K', text: 'K/A = 0.307 МэВ·см²/г при A = 1 г/моль (4πN_A r_e² m_e c²)' }
      - { s: z, tex: 'z', text: 'заряд летящей частицы в единицах e (α-частица — 2)' }
      - { s: Z, tex: 'Z', text: 'заряд ядер вещества' }
      - { s: A, tex: 'A', text: 'массовое число вещества; Z/A ≈ 1/2 почти для всех' }
      - { s: b, tex: '\beta', text: 'скорость частицы v/c' }
      - { s: I, tex: 'I', text: 'средний потенциал ионизации вещества (Al — 166 эВ, Pb — 823 эВ)', unit: 'эВ' }
    when: 'Тяжёлые частицы (p, α, μ, π) с не слишком малой скоростью. При малых β частица захватывает электроны, формула завышает; для релятивистских частиц нужна полная формула с γ² и поправкой на плотность.'
    derivation:
      - { note: 'Электрон на прицельном расстоянии $b$ получает импульс $\Delta p = 2ze^2/(4\pi\varepsilon_0 bv)$ и энергию $\Delta p^2/2m_e$.' }
      - { note: 'Суммируем по кольцам $2\pi b\,db$ с концентрацией электронов $n_e$ — получается формула Бора с $\ln(b_{\max}/b_{\min})$.' }
      - { note: 'Квантовый расчёт Бете заменяет логарифм на $\ln(2m_ec^2\beta^2/I)$.' }
    example: 'α-частица 160 МэВ в алюминии: β² = 0.0806, −dE/dx = 7.34 · ln 496 = 45.6 МэВ/(г/см²).'
