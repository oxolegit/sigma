items:
  - id: poisson
    title: Распределение Пуассона
    match: ['P_n=\frac{\lambda^n}{n!}e^{-\lambda}']
    display: '\htmlData{s=P}{P_n} = \frac{\htmlData{s=l}{\lambda}^{\htmlData{s=n}{n}}}{n!}\,e^{-\lambda}'
    meaning: 'Вероятность насчитать ровно n событий, если они случаются независимо и в среднем λ раз за время измерения. Так распределены отсчёты детектора, распады, совпадения.'
    symbols:
      - { s: P, tex: 'P_n', text: 'вероятность ровно n событий' }
      - { s: l, tex: '\lambda', text: 'среднее число событий за время измерения: λ = νt' }
      - { s: n, tex: 'n', text: 'число событий: 0, 1, 2, …' }
    when: 'События независимы, их много возможных, а каждое редкое (предел биномиального при p → 0, N → ∞, Np = λ). Среднее и дисперсия равны λ, поэтому σ = √λ.'
    derivation:
      - { note: 'Биномиальное распределение для $N$ попыток с вероятностью $p$:', tex: 'P_n = \frac{N!}{n!(N-n)!}p^n(1-p)^{N-n}' }
      - { note: 'При $N \to \infty$, $Np = \lambda$: $\frac{N!}{(N-n)!}p^n \to \lambda^n$, а $(1-p)^{N} \to e^{-\lambda}$.', tex: 'P_n = \frac{\lambda^n}{n!}e^{-\lambda}' }
    example: 'λ = 2: ни одного события — e⁻² = 13.5 %, ровно два — 2e⁻² = 27 %.'
