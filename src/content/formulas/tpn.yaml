items:
  - id: mfp
    title: Длина свободного пробега
    match: ['\lambda_t=\frac{1}{\Sigma_t}']
    display: '\htmlData{s=l}{\lambda_t} = \frac{1}{\htmlData{s=S}{\Sigma_t}}'
    meaning: 'Средний путь нейтрона между столкновениями. Чем больше макроскопическое сечение, тем чаще столкновения и тем короче пробег.'
    symbols:
      - { s: l, tex: '\lambda_t', text: 'средняя длина свободного пробега', unit: 'см' }
      - { s: S, tex: '\Sigma_t', text: 'полное макроскопическое сечение Σ = Nσ: вероятность взаимодействия на единице пути', unit: 'см⁻¹' }
    when: 'Однородная среда, нейтроны одной энергии. Путь до столкновения распределён экспоненциально: доля пролетевших x без столкновений — e^{−Σx}.'
    derivation:
      - { note: 'Вероятность пройти $x$ без столкновения $e^{-\Sigma_t x}$, плотность вероятности столкнуться на $[x, x + dx]$ — $\Sigma_t e^{-\Sigma_t x}dx$.' }
      - { note: 'Средний путь:', tex: '\lambda_t = \int_0^\infty x\,\Sigma_te^{-\Sigma_t x}dx = \frac{1}{\Sigma_t}' }
    example: 'Вода для тепловых нейтронов: Σ_t ≈ 3.45 см⁻¹, λ ≈ 0.29 см.'
