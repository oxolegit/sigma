work: 1
title: Подготовка к самостоятельной по ТПН
lead: 'Четыре дня по часу: сечения и пробег, распределение Максвелла, размер ядра и нейтронный газ, затем прогон варианта. Справочного листка на СР нет, поэтому константы и формулы ниже нужно знать наизусть: проверяйте себя карточками, пока все не станут «помню».'
days:
  - title: Сечения, пробег и защита
    minutes: 60
    steps:
      - { text: 'Урок 3: микро- и макросечение, $\Sigma = N\sigma$, сечение смеси', lesson: 3 }
      - { text: 'Урок 4: $\lambda = 1/\Sigma_t$, ослабление узкого пучка $e^{-\Sigma x}$, узкая и широкая геометрия', lesson: 4 }
      - { text: 'Решить на бумаге разборы 2 и 3 (уран, свинец), только потом открыть шаги', to: sr }
      - { text: 'Карточки: «Константы» и «Сечения и пробег»' }
  - title: Распределение Максвелла
    minutes: 60
    steps:
      - { text: 'Урок 10, раздел 2: спектры плотности и потока, $kT$, 2200 м/с', lesson: 10 }
      - { text: 'Вывести самому: максимум $\sqrt E\,e^{-E/kT}$ при $kT/2$ и максимум $E\,e^{-E/kT}$ при $kT$' }
      - { text: 'Урок 6: почему среднее сечение $1/V$-поглотителя по потоку — $\tfrac{\sqrt\pi}{2}\sigma_0\sqrt{T_0/T}$', lesson: 6 }
      - { text: 'Карточки: «Максвелл»' }
  - title: Размер ядра, волна и nkT
    minutes: 60
    steps:
      - { text: 'Урок 1: приведённая длина волны нейтрона, $\bar\lambda \approx 4.55/\sqrt{E[\text{МэВ}]}$ фм', lesson: 1 }
      - { text: 'Урок 9: когда сечение «геометрическое», $kR \gg 1$ и $\sigma_t \to 2\pi R^2$', lesson: 9 }
      - { text: 'Урок 5: $\Phi = nV$ — связь потока и плотности', lesson: 5 }
      - { text: 'Решить разборы 1 и 4 (Fe‑56, давление нейтронного газа)', to: sr }
      - { text: 'Карточки: «Ядро и волна», «Нейтронный газ»' }
  - title: Прогон
    minutes: 50
    steps:
      - { text: 'Вариант 1 целиком за 40 минут, без подсказок и шпаргалки', to: sr }
      - { text: 'Ещё один случайный вариант — только темы, где ошибся', to: sr }
      - { text: 'Карточки в режиме «Проверка себя», скрыв выученные' }
      - { text: 'Пробежать шпаргалку курса глазами', to: sheet }
memorize:
  - title: Константы
    items:
      - { title: Барн, tex: '1\ \text{б} = 10^{-24}\ \text{см}^2 = 100\ \text{фм}^2' }
      - { title: Число Авогадро, tex: 'N_A = 6.02\cdot10^{23}\ \text{моль}^{-1}' }
      - { title: Конверсионная константа и масса нейтрона, tex: '\hbar c \approx 197\ \text{МэВ}\cdot\text{фм},\qquad m_nc^2 = 939.6\ \text{МэВ}' }
      - { title: Постоянная Больцмана, tex: 'k = 1.38\cdot10^{-23}\ \text{Дж/К} = 8.62\cdot10^{-5}\ \text{эВ/К},\qquad 1\ \text{эВ} = 1.6\cdot10^{-19}\ \text{Дж}' }
      - { title: Тепловая точка, tex: 'T_0 = 293.6\ \text{К},\quad kT_0 = 0.0253\ \text{эВ},\quad V_0 = 2200\ \text{м/с}' }
      - { title: Сечения поглощения тепловых нейтронов, tex: '\sigma_a(^{238}\text{U}) = 2.7\ \text{б},\quad \sigma_a(^{235}\text{U}) \approx 680\ \text{б},\quad \sigma_a(\text{H}) = 0.33\ \text{б}', note: 'В природном уране 0.72 % $^{235}$U. На семинаре для $^{235}$U давали 600 б — берите число из условия.' }
  - title: Ядро и волна
    items:
      - { title: Радиус ядра, tex: 'R = r_0A^{1/3},\qquad r_0 = 1.2\text{–}1.4\ \text{фм},\qquad \sigma_{\text{геом}} = \pi R^2' }
      - { title: Приведённая длина волны нейтрона, tex: '\bar\lambda = \frac{\hbar}{p} = \frac{\hbar c}{\sqrt{2m_nc^2E}} \approx \frac{4.55}{\sqrt{E[\text{МэВ}]}}\ \text{фм}', note: 'Для тепловых, 0.0253 эВ: $\bar\lambda \approx 2.9\cdot10^{-9}$ см — в тысячи раз больше ядра.' }
      - { title: Когда сечение геометрическое, tex: 'kR = R/\bar\lambda \gg 1:\quad \sigma_t \to 2\pi(R + \bar\lambda)^2', note: 'Половина — поглощение и отражение, половина — дифракция вперёд («тень»). $\bar\lambda = R$ около 1 МэВ, геометрическая картина — от ~10 МэВ.' }
  - title: Сечения и пробег
    items:
      - { title: Ядерная плотность, tex: 'N = \frac{\rho N_A}{M}' }
      - { title: Макросечение и смесь, tex: '\Sigma = N\sigma,\qquad \Sigma = \sum_i N_i\sigma_i,\qquad \bar\sigma = c\,\sigma_5 + (1 - c)\,\sigma_8', note: '$c$ — обогащение, доля ядер $^{235}$U.' }
      - { title: Длина свободного пробега, tex: '\lambda = \frac1{\Sigma_t}' }
      - { title: Ослабление узкого пучка, tex: '\Phi(x) = \Phi_0e^{-\Sigma x},\qquad x = \frac{\ln k}{\Sigma},\qquad x_{1/2} = \frac{\ln2}{\Sigma}', note: 'Только нерассеянные нейтроны. Реальная защита толще: фактор накопления рассеянных, тяжёлые ядра не замедляют, захватные γ.' }
      - { title: Скорость реакций, tex: 'R = \Sigma\Phi\quad [\text{см}^{-3}\text{с}^{-1}]' }
  - title: Максвелл
    items:
      - { title: Спектры плотности и потока, tex: 'n(E) \propto \sqrt E\,e^{-E/kT},\qquad \Phi(E) \propto E\,e^{-E/kT}' }
      - { title: Наиболее вероятные и средние энергии, tex: 'n:\ E_{\text{вер}} = \tfrac12kT,\ \bar E = \tfrac32kT;\qquad \Phi:\ E_{\text{вер}} = kT,\ \bar E = 2kT' }
      - { title: Скорости, tex: 'V_T = \sqrt{2kT/m_n},\qquad \bar V = \frac{2}{\sqrt\pi}V_T,\qquad E = \frac{m_nV^2}{2}' }
      - { title: Сечение 1/V-поглотителя по потоку, tex: '\bar\sigma = \frac{\sqrt\pi}{2}\,\sigma_0\sqrt{\frac{T_0}{T}},\qquad \frac{\sqrt\pi}{2} \approx 0.886' }
  - title: Нейтронный газ
    items:
      - { title: Поток и плотность, tex: '\Phi = nV' }
      - { title: Давление и энергия газа, tex: 'p = nkT,\qquad w = \tfrac32nkT', note: 'При $\Phi = 10^{14}$ см⁻²с⁻¹ давление ~$10^{-6}$ Па.' }
      - { title: Невырожденность, tex: '\Lambda = \frac{h}{\sqrt{2\pi m_nkT}} \approx 1.8\cdot10^{-8}\ \text{см},\qquad n\Lambda^3 \ll 1' }
